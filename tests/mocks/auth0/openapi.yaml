openapi: 3.0.0
info:
  title: Auth0 Management API
  version: v2
  description: Auth0 Management API specification for A0Hero testing

servers:
  - url: https://{tenant}.auth0.com/api/v2
    variables:
      tenant:
        description: Your Auth0 tenant domain
        default: dev-example

paths:
  /logs:
    get:
      operationId: list_logs
      summary: Retrieve log events
      description: Retrieves a list of events from your Auth0 log stream
      parameters:
        - name: from
          in: query
          description: Log event ID to start from (cursor-based pagination)
          schema:
            type: string
          example: "900000000000000000000000000000000000000000000"
        - name: take
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            default: 50
            maximum: 100
          example: 10
        - name: q
          in: query
          description: Query in Lucene syntax for filtering
          schema:
            type: string
          example: "type:s"
        - name: sort
          in: query
          description: Sort field and direction
          schema:
            type: string
          example: "date:-1"
      responses:
        '200':
          description: List of log events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /logs/{id}:
    get:
      operationId: get_log
      summary: Retrieve a log event
      description: Retrieves the details of a specific log event by its ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the log event
          schema:
            type: string
          example: "900000000000000000000000000000000000000000000"
      responses:
        '200':
          description: Log event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  schemas:
    LogEvent:
      type: object
      properties:
        log_id:
          type: string
          description: Unique identifier for the log event
        date:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the event
        type:
          type: string
          description: Log event type code (e.g., 's', 'felo', 'sapi')
        ip:
          type: string
          description: IP address of the client
        user_id:
          type: string
          description: Auth0 user ID
        user_name:
          type: string
          description: Username or email
        client_id:
          type: string
          description: Client ID of the application
        details:
          type: object
          description: Additional event details
        data:
          type: object
          description: Raw event data
        tenant_id:
          type: string
        location_info:
          type: object
          description: Geographic location data
      required:
        - date
        - type

    Error:
      type: object
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
        errorCode:
          type: string

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 401
            error: unauthorized
            message: Invalid token

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 403
            error: forbidden
            message: Insufficient scope

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 404
            error: not_found
            message: Log event not found

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 429
            error: rate_limit_exceeded
            message: Rate limit exceeded

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 500
            error: server_error
            message: Internal server error

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
